name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unicom_test
          POSTGRES_USER: unicom_app
          POSTGRES_PASSWORD: change-me-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicom_app -d unicom_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @unicom/database exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://unicom_app:change-me-local@localhost:5432/unicom_test?schema=public
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unicom_test
          POSTGRES_USER: unicom_app
          POSTGRES_PASSWORD: change-me-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicom_app -d unicom_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @unicom/database exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://unicom_app:change-me-local@localhost:5432/unicom_test?schema=public
      - run: pnpm --filter @unicom/api exec playwright install --with-deps chromium
      - run: pnpm test:e2e
