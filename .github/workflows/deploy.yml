name: Continuous Deployment (CD)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Run Quality Suite & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gate Checks
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  build-and-push-docker:
    name: Build & Push Docker Images to GHCR
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unicom-api:latest
            ghcr.io/${{ github.repository_owner }}/unicom-api:${{ github.sha }}

      - name: Build & Push Web Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unicom-web:latest
            ghcr.io/${{ github.repository_owner }}/unicom-web:${{ github.sha }}

      - name: Build & Push Background Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unicom-worker:latest
            ghcr.io/${{ github.repository_owner }}/unicom-worker:${{ github.sha }}

  deploy-to-server:
    name: Deploy to Production Server
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: ${{ vars.SERVER_HOST != '' }}

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/unicom-university || git clone https://github.com/${{ github.repository }}.git /opt/unicom-university && cd /opt/unicom-university
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
