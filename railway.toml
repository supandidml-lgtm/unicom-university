[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build --workspace=@unicom/types && npm run build --workspace=@unicom/config && npm run build --workspace=@unicom/validation && npm run build --workspace=@unicom/api"

[deploy]
  startCommand = "npm run start:api"
  healthcheckPath = "/api/v1/health"
  healthcheckTimeout = 45
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
